services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/you_gym?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: you_gym
      SPRING_DATASOURCE_PASSWORD: you_gym_local
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      REDIS_URL: redis://redis:6379
      YOUGYM_INTEGRATION_MODE: mock
      YOUGYM_ADMIN_BOOTSTRAP_ENABLED: "true"
      YOUGYM_ADMIN_BOOTSTRAP_USERNAME: owner
      YOUGYM_ADMIN_BOOTSTRAP_PASSWORD: local-admin-pass
      YOUGYM_ADMIN_BOOTSTRAP_DISPLAY_NAME: Local Owner
      YOUGYM_ADMIN_REGISTRATION_ENABLED: "true"
      YOUGYM_ADMIN_REGISTRATION_INVITE_CODE: local-invite-code
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - yougym-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: you_gym
      MYSQL_USER: you_gym
      MYSQL_PASSWORD: you_gym_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3306:3306"
    volumes:
      - yougym-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_local_only"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yougym_local
      MINIO_ROOT_PASSWORD: yougym_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yougym-minio:/data

volumes:
  yougym-redis:
  yougym-mysql:
  yougym-minio:
